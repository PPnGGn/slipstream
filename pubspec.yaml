name: slipstream
description: "A new Flutter project."
publish_to: 'none'
version: 2.1.1+37
environment:
  sdk: ^3.11.4

dependencies:
  go_router: ^18.1.1
  flutter:
    sdk: flutter
  talker_flutter: ^5.1.20
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  http: ^1.6.0
  crypto: ^3.0.7
  collection: ^1.19.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  flutter_svg: ^2.3.0
  pointycastle: ^4.0.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  pigeon: ^26.3.4
  build_runner: ^2.15.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - shorebird.yaml
  fonts:
    - family: Oswald
      fonts:
        - asset: assets/oswald/Oswald.ttf
