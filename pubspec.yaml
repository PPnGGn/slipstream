name: slipstream
description: "A new Flutter project."
publish_to: 'none'
version: 2.1.6+43
environment:
  sdk: ^3.11.4

dependencies:
  go_router: ^18.1.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned by flutter_localizations to the version its SDK ships with, so any
  # SDK (the local one and the CI one) gets the matching release.
  intl: any
  talker_flutter: ^5.2.0
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  http: ^1.6.0
  crypto: ^3.0.8
  collection: ^1.19.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  flutter_svg: ^2.3.2
  pointycastle: ^4.0.0
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  # The code generators stay where CI can run them: its Flutter (3.44.8) ships
  # Dart 3.12, and freezed 4 needs Dart 3.13 (pigeon 29 needs freezed 4's
  # analyzer, so they go together). Raise them with the Flutter version in
  # .github/workflows/release.yml, not before.
  pigeon: ^26.3.4
  build_runner: ^2.15.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
  # Builds AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  assets:
    - assets/svg/
    - shorebird.yaml
  fonts:
    - family: Oswald
      fonts:
        - asset: assets/oswald/Oswald.ttf
