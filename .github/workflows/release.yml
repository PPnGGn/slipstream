name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      mode: ${{ steps.compare.outputs.mode }}
      release_version: ${{ steps.compare.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse pubspec version
        id: parse
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse version from pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Parsed pubspec version: $VERSION"

      - name: Get latest release tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: ${TAG:-<none>}"

      - name: Compare versions and pick release/patch mode
        id: compare
        env:
          PUBSPEC_VERSION: ${{ steps.parse.outputs.version }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          python3 - <<'PYEOF'
          import os
          import sys

          pubspec = os.environ["PUBSPEC_VERSION"]
          latest = os.environ.get("LATEST_TAG", "")

          def parse(v: str):
              v = v.lstrip("v").strip()
              if not v:
                  return None
              base, _, build = v.partition("+")
              core = tuple(int(x) for x in base.split("."))
              while len(core) < 3:
                  core = core + (0,)
              build_n = int(build) if build else 0
              return core, build_n

          def gh_out(key: str, value: str) -> None:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{key}={value}\n")

          if not latest:
              print(f"No previous release found; publishing first release {pubspec}.")
              gh_out("mode", "release")
              gh_out("release_version", "")
              sys.exit(0)

          p = parse(pubspec)
          l = parse(latest)
          if p is None or l is None:
              print(f"::error::Could not parse versions: pubspec={pubspec!r} latest={latest!r}")
              sys.exit(1)

          p_core, p_build = p
          l_core, l_build = l
          latest_stripped = latest.lstrip("v")

          if p_core == l_core:
              if p_build > l_build:
                  print(f"OK: {pubspec} bumps only the build number over {latest}; patching that release.")
                  gh_out("mode", "patch")
                  gh_out("release_version", latest_stripped)
              else:
                  print(
                      f"::error::pubspec version {pubspec} does not bump the build number over last release {latest}. "
                      f"Bump the `+N` build number in pubspec.yaml to ship a patch."
                  )
                  sys.exit(1)
          elif p_core > l_core:
              print(f"OK: {pubspec} bumps the version over {latest}; publishing a new release.")
              gh_out("mode", "release")
              gh_out("release_version", "")
          else:
              print(
                  f"::error::pubspec version {pubspec} is not greater than last release {latest}. "
                  f"Bump `version:` in pubspec.yaml."
              )
              sys.exit(1)
          PYEOF

  build-core-android:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout slipstream-core
        uses: actions/checkout@v4
        with:
          repository: PPnGGn/slipstream-core
          path: slipstream-core

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: slipstream-core/go.sum

      - name: Set up Android NDK
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install gomobile
        run: go install golang.org/x/mobile/cmd/gomobile@latest

      - name: gomobile init
        working-directory: slipstream-core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gomobile init

      - name: Build slipstreamcore.aar
        working-directory: slipstream-core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          gomobile bind -target=android -androidapi 21 -javapkg com.slipstream -o slipstreamcore.aar ./android

      - uses: actions/upload-artifact@v4
        with:
          name: slipstreamcore-aar
          path: slipstream-core/slipstreamcore.aar
          if-no-files-found: error
          retention-days: 7

  build-android:
    needs: [version-check, build-core-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download slipstreamcore.aar
        uses: actions/download-artifact@v4
        with:
          name: slipstreamcore-aar
          path: android/app/libs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get
      - name: Generate Pigeon Updater API
        run: make generate-updater-api
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate Pigeon VPN API
        run: make generate-vpn-api

      - name: Shorebird release (android)
        if: needs.version-check.outputs.mode == 'release'
        uses: shorebirdtech/shorebird-release@v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          platform: android
          flutter-version: ${{ env.FLUTTER_VERSION }}
          args: --artifact apk

      - name: Shorebird patch (android)
        if: needs.version-check.outputs.mode == 'patch'
        uses: shorebirdtech/shorebird-patch@v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          platform: android
          release-version: ${{ needs.version-check.outputs.release_version }}

      - uses: actions/upload-artifact@v4
        if: needs.version-check.outputs.mode == 'release'
        with:
          name: android-apk
          path: build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  build-linux:
    needs: version-check
    if: needs.version-check.outputs.mode == 'release'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release

      - name: Archive Linux bundle
        run: tar -czf slipstream-linux.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-tar
          path: slipstream-linux.tar.gz
          if-no-files-found: ignore
          retention-days: 14

  build-windows:
    needs: version-check
    if: needs.version-check.outputs.mode == 'release'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release

      - name: Archive Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath slipstream-windows.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-zip
          path: slipstream-windows.zip
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: [version-check, build-android, build-linux, build-windows]
    if: |
      always() &&
      needs.version-check.outputs.mode == 'release' &&
      needs.version-check.result == 'success' &&
      needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: assets

      - name: Download Linux bundle (best-effort)
        uses: actions/download-artifact@v4
        with:
          name: linux-tar
          path: assets
        continue-on-error: true

      - name: Download Windows bundle (best-effort)
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: assets
        continue-on-error: true

      - name: Normalize asset names
        run: |
          mkdir -p release-assets
          if [ -f assets/app-release.apk ]; then
            cp assets/app-release.apk release-assets/slipstream-android.apk
          fi
          if [ -f assets/slipstream-linux.tar.gz ]; then
            cp assets/slipstream-linux.tar.gz release-assets/
          fi
          if [ -f assets/slipstream-windows.zip ]; then
            cp assets/slipstream-windows.zip release-assets/
          fi
          ls -l release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            release-assets/*

      - name: Upload assets (clobber any existing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            gh release upload "v$VERSION" "$f" --clobber
          done
